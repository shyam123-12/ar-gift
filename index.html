<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Memory Frame</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px;
        }
        #startButton {
            background: #ff4757; color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,71,87,0.4); margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Mobile User Permission & Loading Overlay -->
    <div id="overlay">
        <h2>AR Memory Frame</h2>
        <p>Tap the button below to allow camera access and start your video experience.</p>
        <button id="startButton">Tap to Start AR</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const frameId = urlParams.get('id') || 'frame001';

        const mindFileUrl = `./targets/${frameId}.mind`;
        const videoFileUrl = `./videos/${frameId}.mp4`;

        // Inject the AR Scene
        document.write(`
            <a-scene mindar-image="imageTargetSrc: ${mindFileUrl}; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
                <a-assets>
                    <video id="giftVideo" src="${videoFileUrl}" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
                </a-assets>

                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                <a-entity mindar-image-target="targetIndex: 0" id="arTarget">
                    <a-video src="#giftVideo" position="0 0 0" rotation="0 0 0" width="1" height="0.5625"></a-video>
                </a-entity>
            </a-scene>
        `);
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startButton = document.querySelector("#startButton");
            const overlay = document.querySelector("#overlay");
            const videoEl = document.querySelector("#giftVideo");
            const targetEl = document.querySelector("#arTarget");
            const sceneEl = document.querySelector("a-scene");

            startButton.addEventListener("click", () => {
                // Hide overlay screen
                overlay.style.display = "none";

                // Prime/load the video for mobile browsers
                videoEl.play().then(() => {
                    videoEl.pause();
                    videoEl.currentTime = 0;
                }).catch(e => console.log("Video priming error:", e));

                // Start the MindAR camera system
                const arSystem = sceneEl.systems["mindar-image-system"];
                arSystem.start();
            });

            // Play video when picture frame is detected
            targetEl.addEventListener("targetFound", () => {
                videoEl.play();
            });

            // Pause video when camera looks away from picture frame
            targetEl.addEventListener("targetLost", () => {
                videoEl.pause();
            });
        });
    </script>
</body>
</html>
