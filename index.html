<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Memory Frame</title>
    <!-- Include A-Frame and MindAR libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; font-size: 18px; background: rgba(0,0,0,0.7);
            padding: 15px 25px; border-radius: 8px; z-index: 999; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Initializing Camera & AR...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const frameId = urlParams.get('id');

        if (!frameId) {
            document.getElementById('loading').innerText = "Error: No Frame ID specified in the link!";
        } else {
            const mindFileUrl = `./targets/${frameId}.mind`;
            const videoFileUrl = `./videos/${frameId}.mp4`;

            document.write(`
                <a-scene mindar-image="imageTargetSrc: ${mindFileUrl}; autoStart: true;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
                    <a-assets>
                        <video id="giftVideo" src="${videoFileUrl}" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
                    </a-assets>

                    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                    <a-entity mindar-image-target="targetIndex: 0" id="arTarget">
                        <a-video src="#giftVideo" position="0 0 0" rotation="0 0 0" width="1" height="0.5625"></a-video>
                    </a-entity>
                </a-scene>
            `);
        }
    </script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const targetEl = document.querySelector("#arTarget");
                const videoEl = document.querySelector("#giftVideo");
                const loadingEl = document.querySelector("#loading");

                if (targetEl && videoEl) {
                    // Ensure video loads metadata so it doesn't stay blank
                    videoEl.load();

                    targetEl.addEventListener("targetFound", () => {
                        loadingEl.style.display = 'none';
                        videoEl.play().catch(error => {
                            console.log("Autoplay prevented:", error);
                        });
                    });

                    targetEl.addEventListener("targetLost", () => {
                        videoEl.pause();
                    });
                }
            }, 2000);
        });
    </script>
</body>
</html>
