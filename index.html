<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Memory Frame</title>
    <!-- Stable CDN Script Imports -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px;
        }
        #startButton {
            background: #ff4757; color: white; border: none; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,71,87,0.4); margin-top: 20px;
        }
        #errorMsg { color: #ff6b81; margin-top: 15px; font-size: 14px; max-width: 80%; }
    </style>
</head>
<body>

    <!-- Permission & Start Overlay -->
    <div id="overlay">
        <h2>AR Memory Frame</h2>
        <p>Tap below to start the camera and view your video frame.</p>
        <button id="startButton">Tap to Start AR</button>
        <div id="errorMsg"></div>
    </div>

    <!-- Static AR Scene (No dynamic injection to prevent white screens) -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets/frame001.mind; autoStart: false;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="giftVideo" src="./videos/frame001.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="arTarget">
            <a-video src="#giftVideo" position="0 0 0" rotation="0 0 0" width="1" height="0.5625"></a-video>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startButton = document.querySelector("#startButton");
            const overlay = document.querySelector("#overlay");
            const videoEl = document.querySelector("#giftVideo");
            const targetEl = document.querySelector("#arTarget");
            const sceneEl = document.querySelector("a-scene");
            const errorMsg = document.querySelector("#errorMsg");

            // Handle URL parameters dynamically if a custom ID is passed (e.g. ?id=frame002)
            const urlParams = new URLSearchParams(window.location.search);
            const frameId = urlParams.get('id');
            
            if (frameId) {
                sceneEl.setAttribute('mindar-image', `imageTargetSrc: ./targets/${frameId}.mind; autoStart: false;`);
                videoEl.setAttribute('src', `./videos/${frameId}.mp4`);
            }

            startButton.addEventListener("click", () => {
                // Prime video element for mobile restriction bypass
                videoEl.play().then(() => {
                    videoEl.pause();
                    videoEl.currentTime = 0;
                }).catch(e => console.log("Prime error:", e));

                // Hide overlay and boot up MindAR camera system safely
                overlay.style.display = "none";
                
                try {
                    const arSystem = sceneEl.systems["mindar-image-system"];
                    arSystem.start();
                } catch (err) {
                    errorMsg.innerText = "Camera initialization failed. Please check permissions.";
                    overlay.style.display = "flex";
                }
            });

            // Play video when tracking target is locked
            targetEl.addEventListener("targetFound", () => {
                videoEl.play();
            });

            // Pause when target is lost out of camera view
            targetEl.addEventListener("targetLost", () => {
                videoEl.pause();
            });
        });
    </script>
</body>
</html>
